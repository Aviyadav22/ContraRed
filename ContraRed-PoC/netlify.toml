[build]
  base = "ContraRed-PoC"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # API_BASE_URL is set in Netlify dashboard environment variables
  # Do NOT set here to avoid exposing in git history

# Office Add-ins require specific CORS headers for the WebView container
[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "https://contrared-api.onrender.com"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    # Note: X-Frame-Options intentionally omitted — add-in runs in Office iframe
    Content-Security-Policy = "default-src 'self' https://contrared-api.onrender.com; script-src 'self' 'unsafe-eval' https://appsforoffice.microsoft.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://contrared-api.onrender.com https://contrared-addin.netlify.app; img-src 'self' data:; frame-ancestors 'self' https://*.office.com https://*.microsoft.com https://*.office365.com;"

# Redirect root to taskpane
[[redirects]]
  from = "/"
  to = "/taskpane.html"
  status = 301

[[redirects]]
  from = "/taskpane"
  to = "/taskpane.html"
  status = 200
