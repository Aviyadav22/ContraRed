name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov aiosqlite httpx
      - name: Run tests
        env:
          SECRET_KEY: "test-secret-key-for-ci-minimum-32-characters-long"
          DEBUG: "true"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        run: pytest tests/ -v --tb=short

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit Python dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip-audit --requirement requirements.txt --output pip-audit-report.json --format json
          pip-audit --requirement requirements.txt --desc

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # AUDIT FIX M2: npm audit now blocks CI on critical vulnerabilities
      # (previously used || true which silently swallowed all findings)
      - name: Audit Dashboard dependencies
        run: |
          cd dashboard
          npm ci
          npm audit --audit-level=critical

      - name: Audit Word Add-in dependencies
        run: |
          cd ContraRed-PoC
          npm ci
          npm audit --audit-level=critical

      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-audit-reports
          path: backend/pip-audit-report.json
          retention-days: 30

  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan (HIGH/CRITICAL = blocking)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: 'backend/'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          format: 'table'
      - name: Trivy SARIF report
        if: always()
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: 'backend/'
          severity: 'HIGH,CRITICAL'
          format: 'sarif'
          output: 'trivy-results.sarif'
      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  # AUDIT FIX M1: Use npm ci (not npm install) for reproducible builds
  dashboard-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          VITE_API_URL: "https://contrared-api.onrender.com/api/v1"

  addin-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ContraRed-PoC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build
        env:
          API_BASE_URL: "https://contrared-api.onrender.com/api/v1"
