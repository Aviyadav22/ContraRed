name: Keep Database Awake

on:
  schedule:
    # Every 10 minutes. The API now runs on the VPS and never sleeps, but
    # Supabase free projects pause after a week without traffic.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

concurrency:
  group: keepalive
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping backend /health/db
        run: |
          # /health/db runs SELECT 1 so the SQLAlchemy pool keeps a live connection —
          # static /health would keep only the container warm, not the DB pool.
          code=$(curl -sS -o /tmp/body -w "%{http_code}" \
            --connect-timeout 15 --max-time 120 \
            --retry 2 --retry-delay 20 --retry-connrefused \
            https://contrared-api.neetiq.in/health/db || echo "000")
          echo "Status: $code"
          head -c 500 /tmp/body || true
          # 5xx or network-level failure → fail the job so we get a GH notification
          if [ "$code" -ge 500 ] || [ "$code" = "000" ]; then
            exit 1
          fi
